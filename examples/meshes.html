<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>>
	<script src="../libs/copc/index.js"></script>

	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">
		</div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";
		import { MTLLoader } from "../libs/three.js/loaders/MTLLoader.js";
		import { OBJLoader } from "../libs/three.js/loaders/OBJLoader.js";
		import { GLTFLoader } from "../libs/three.js/loaders/GLTFLoader.js";
		import { DRACOLoader } from "../libs/three.js/loaders/DRACOLoader.js";
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setDescription(
			"Point cloud courtesy of <a target='_blank' href='https://www.sigeom.ch/'>sigeom sa</a>"
		);

		viewer.loadGUI(() => {
			viewer.setLanguage("en");
			$("#menu_tools").next().show();
			$("#menu_scene").next().show();
		});

		const eptPath = "../resources/basemap/entwine_pointcloud/ept.json";
		const cloudName = "lion";

		Potree.loadPointCloud(eptPath, cloudName, e => {
			const pointcloud = e.pointcloud;
			viewer.scene.addPointCloud(pointcloud);

			// 1. คำนวณ geoCenter จาก Potree geometry + offset
			const geoBB = pointcloud.pcoGeometry.boundingBox.clone();
			const geoCenter = geoBB.getCenter(new THREE.Vector3())
				.add(pointcloud.pcoGeometry.offset);

			// วาด helper sphere ให้รู้ตำแหน่ง geoCenter
			const helper = new THREE.Mesh(
				new THREE.SphereGeometry(5, 8, 8),
				new THREE.MeshBasicMaterial({ color: 0xff0000 })
			);
			helper.position.copy(geoCenter);
			viewer.scene.scene.add(helper);

			// วาด BoundingBox ของ pointcloud
			const bbHelperPC = new THREE.Box3Helper(geoBB, 0x00ff00);
			bbHelperPC.applyMatrix4(new THREE.Matrix4().makeTranslation(
				pointcloud.position.x,
				pointcloud.position.y,
				pointcloud.position.z
			));
			viewer.scene.scene.add(bbHelperPC);

			// โหลด OBJ แล้ว align
			loadOdmMesh(geoCenter, geoBB);
		});

		function loadOdmMesh(worldCenter) {
			const mtlLoader = new MTLLoader();
			mtlLoader.setPath(`${Potree.resourcePath}/basemap/odm_texturing/`);
			mtlLoader.load("odm_textured_model_geo.mtl", materials => {
				materials.preload();

				const objLoader = new OBJLoader();
				objLoader.setMaterials(materials);
				objLoader.setPath(`${Potree.resourcePath}/basemap/odm_texturing/`);
				objLoader.load("odm_textured_model_geo.obj", mesh => {
					// 1. รีเซ็ต transforms
					mesh.position.set(0, 0, 0);
					mesh.rotation.set(0, 0, 0);
					mesh.scale.set(1, 1, 1);

					// 2. ปรับแกนจาก Z-up → Y-up
					mesh.rotateX(-Math.PI / 2);

					// อัปเดต matrix ก่อนคำนวณขอบเขต
					mesh.updateMatrixWorld(true);

					// 3. คำนวณ bounding box หลังหมุน
					const objBB = new THREE.Box3().setFromObject(mesh);
					const objCenter = objBB.getCenter(new THREE.Vector3());
					console.log("OBJ Center (หลังหมุน):", objCenter);

					// 4. เลื่อนโมเดลให้ center มาตรงกับ worldCenter
					//    mesh.position = -objCenter (ย้าย center มา origin) + worldCenter
					mesh.position.sub(objCenter).add(worldCenter);

					viewer.scene.scene.add(mesh);
				});
			});
		}
		{
			const dir = new THREE.DirectionalLight(0xffffff, 1.0);
			dir.position.set(10, 10, 10).normalize();
			const amb = new THREE.AmbientLight(0x555555);
			viewer.scene.scene.add(dir, amb);
		}
	</script>



</body>

</html>
